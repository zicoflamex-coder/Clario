name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create . --platforms=android --project-name clario --org com.zico

      - name: Add native code, icons and permissions
        run: |
          pip install pillow
          mkdir -p android/app/src/main/kotlin/com/zico/clario
          cp native/*.kt android/app/src/main/kotlin/com/zico/clario/
          python3 native/make_icons.py
          python3 native/patch_manifest.py

      - name: Use fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink --build-number=${{ github.run_number }}

      - name: Sign APK with the fixed key
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/unsigned.apk
          ${BT}apksigner sign --ks native/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out build/app/outputs/flutter-apk/app-release.apk /tmp/unsigned.apk
          ${BT}apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clario-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Clario v2.2.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
